<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>悬空夺床 · 本地比赛中心</title>
<style>[hidden]{display:none!important}:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0c1421;color:#e9eff8}body{margin:auto;padding:28px;max-width:1440px}h1{font-size:28px;margin:0 0 8px}p{color:#aebed2;line-height:1.6}button,input,select{font:inherit;border:1px solid #3b506b;border-radius:7px;padding:9px 14px;background:#192b40;color:#fff}button{cursor:pointer}button:hover{background:#264861}button:disabled{opacity:.5;cursor:wait}.toolbar,.metrics{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:18px 0}.metrics>span,.card{border:1px solid #2b4058;background:#132135;border-radius:12px;padding:16px}.metrics b{color:#7fe5c5}.arenas{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:16px}.card h2{font-size:19px;margin:0 0 10px}.state{display:inline-block;color:#8becce;margin:6px 0}.small{font-size:13px;color:#99abc2}.columns{display:grid;grid-template-columns:1fr 1.4fr;gap:20px;margin-top:20px}.list{max-height:360px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #2b4058}th{color:#9db7d2}iframe{width:100%;height:730px;border:1px solid #304763;border-radius:12px;margin-top:16px;background:#0a1220}#error{color:#ffbc99;min-height:22px}#events{max-height:210px;overflow:auto;font-size:13px;line-height:1.8;color:#b7c7db}a{color:#9bddff}@media(max-width:800px){body{padding:16px}.columns{grid-template-columns:1fr}iframe{height:580px}}</style>
<h1>悬空夺床 · 本地比赛中心</h1><p>场地独立开赛。结果保存、选手离场、地图恢复后，自动接入排队中的下一组。</p>
<div class="toolbar"><button id="add">加入 4 个测试 AI</button><button id="pause">暂停新开局</button><label>同时开赛 <select id="capacity"></select></label><span class="small">测试账号使用现有两套模型，组合突袭 / 稳健打法；每次加入各打一局。</span></div>
<div id="error" role="status"></div><div class="metrics" id="metrics"></div><div class="arenas" id="arenas"></div>
<div class="toolbar" id="watchbar" hidden><span id="watchname"></span><a id="watchlink" target="_blank">单独打开观战</a><button id="closewatch">关闭画面</button></div><iframe id="viewer" title="竞技场观战" hidden></iframe>
<div class="columns"><section class="card"><h2>等待入场</h2><div class="list"><table><thead><tr><th>选手</th><th>打法</th><th>已完成</th></tr></thead><tbody id="waiting"></tbody></table></div></section><section class="card"><h2>已保存比赛</h2><div class="list"><table><thead><tr><th>场地</th><th>选手</th><th>结果</th><th>时长</th><th></th></tr></thead><tbody id="results"></tbody></table></div></section></div>
<section class="card" style="margin-top:20px"><h2>调度记录</h2><div id="events"></div></section><p class="small">本页面仅在本机开放。暂停和调低并发只影响新比赛，进行中的比赛继续。账号数量用于排队测试，不代表同时运行数量。</p>
<script>
const $=id=>document.getElementById(id);let state;
const names={available:'空闲，可接下一组',reserved:'选手入场中',running:'比赛进行中',saving:'保存结果',resetting:'恢复地图',ready_to_release:'准备补位',quarantined:'场地隔离，请查看日志',unavailable:'等待场地就绪'};
const gates={open:'正常补位',paused:'已暂停新开局',memory_pressure:'内存不足，暂缓新开局',tick_pressure:'服务器繁忙，暂缓新开局',control_unavailable:'正在连接裁判',coordinator_lease_lost:'调度器接管中',starting:'启动中'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function post(route,data){const r=await fetch('/api/'+route,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),v=await r.json();if(!r.ok)throw Error(v.error);return v;}
async function action(fn){try{$('error').textContent='';await fn();await refresh()}catch(e){$('error').textContent=e.message}}
$('add').onclick=()=>action(()=>post('demo',{count:4,rounds:1}));$('pause').onclick=()=>action(()=>post('pause',{paused:!state.paused}));$('capacity').onchange=e=>action(()=>post('capacity',{max_active:Number(e.target.value)}));
$('closewatch').onclick=()=>{$('viewer').src='about:blank';$('viewer').hidden=true;$('watchbar').hidden=true};
async function watch(id,replay){const {url}=await post('watch',{arena_id:id}),target=replay?url+'replays?match='+encodeURIComponent(replay)+'&autoplay=1':url;$('viewer').src=target;$('viewer').hidden=false;$('watchbar').hidden=false;$('watchname').textContent=id+(replay?' · 回放':' · 实时观战');$('watchlink').href=target;$('watchbar').scrollIntoView({behavior:'smooth',block:'start'});}
$('arenas').onclick=e=>{const button=e.target.closest('[data-watch]');if(button)action(()=>watch(button.dataset.watch))};$('results').onclick=e=>{const b=e.target.closest('[data-replay]');if(b)action(()=>watch(b.dataset.arena,b.dataset.replay))};
async function refresh(){const response=await fetch('/api/status');state=await response.json();if(!response.ok)throw Error(state.error);const waiting=state.waiting.map(id=>state.entrants.find(e=>e.id===id)).filter(e=>e?.state==='waiting');const active=state.arenas.filter(a=>a.state==='running');
$('pause').textContent=state.paused?'继续自动开赛':'暂停新开局';if($('capacity').options.length!==state.capacity+1)$('capacity').innerHTML=Array.from({length:state.capacity+1},(_,i)=>`<option>${i}</option>`).join('');$('capacity').value=state.max_active;
$('metrics').innerHTML=[`排队 <b>${waiting.length}</b> 人`,`正在比赛 <b>${active.length}</b> 场`,`已保存 <b>${state.results.length}</b> 场`,`TPS <b>${Number(state.metrics.tps||0).toFixed(1)}</b>`,`MSPT <b>${Number(state.metrics.mspt||0).toFixed(1)}</b>`,`可用内存 <b>${state.metrics.free_mb}</b> MB`,esc(gates[state.gate]||state.gate)].map(t=>'<span>'+t+'</span>').join('');
$('arenas').innerHTML=state.arenas.map(a=>`<article class="card"><h2>${esc(a.name)}</h2><div class="state">${esc(names[a.state]||a.state)}</div><p>${esc((a.assigned||[]).join(' 对战 ')||'等待下一组')}</p><p class="small">独立世界：${esc(a.world)}<br>结果：${a.saved?'已保存':'等待'} · 地图：${a.restored?'已就绪':'使用 / 恢复中'}</p><button data-watch="${esc(a.id)}">观看这个场地</button></article>`).join('');
$('waiting').innerHTML=waiting.map(e=>`<tr><td>${esc(e.label)}<br><span class="small">${esc(e.id)}</span></td><td>${e.style==='rush'?'突袭':'稳健'}</td><td>${e.completed}/${e.rounds}</td></tr>`).join('')||'<tr><td colspan="3">暂无等待选手，可点击上方按钮加入测试 AI。</td></tr>';
$('results').innerHTML=[...state.results].sort((a,b)=>b.saved_at-a.saved_at).map(r=>`<tr><td>${esc(r.arena_id)}</td><td>${esc(r.players.join(' / '))}</td><td>${esc(r.status==='complete'?(r.winner_id||'平局'):'中止 / 测试，不计胜场')}</td><td>${Math.round(r.duration_seconds)} 秒</td><td><button data-arena="${esc(r.arena_id)}" data-replay="${esc(r.match_id)}">回放</button></td></tr>`).join('')||'<tr><td colspan="5">比赛完成后出现在这里。</td></tr>';
$('events').innerHTML=state.events.map(e=>`<div>${new Date(e.at).toLocaleTimeString()} · ${esc(e.arena_id||'系统')} · ${esc(e.type)} ${esc(e.state?names[e.state]||e.state:'')} ${esc(e.players?.join(' / ')||'')}</div>`).join('');if(state.error)$('error').textContent=state.error;
}
setInterval(()=>refresh().catch(e=>$('error').textContent=e.message),2000);refresh().catch(e=>$('error').textContent=e.message);
</script></html>
