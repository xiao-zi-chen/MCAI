[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-pvp-env"
version = "0.1.0"
description = "No-render Minecraft PvP Gymnasium environment for private local research servers."
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0,<2",
  "numpy>=1.26,<3"
]

[project.optional-dependencies]
ray = ["ray[rllib]>=2.30"]
sb3 = ["stable-baselines3>=2.3", "tensorboard>=2.16", "rich>=13.7"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
