<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>悬空夺床 · 本地观战</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101719;color:#edf4ed;font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid #2c383b}h1{font-size:23px;letter-spacing:2px;margin:0}.tag{font-size:11px;color:#9baaab;letter-spacing:3px}.live{color:#a9e6b5;font-size:12px}.live:before{content:'●';margin-right:9px}main{display:grid;grid-template-columns:minmax(0,1fr) 288px;height:calc(100vh - 84px)}.stage{position:relative;background:#bdd9ed;min-height:450px}iframe{border:0;width:100%;height:100%;display:block}.tools{position:absolute;top:20px;left:22px;display:flex;gap:7px;flex-wrap:wrap}button{background:#142327e8;color:#edf4ed;border:1px solid #526365;border-radius:5px;padding:9px 14px;cursor:pointer;font:inherit;font-size:12px}button:hover{background:#28474d}.hint{position:absolute;bottom:20px;left:22px;color:#203738;background:#f5f9efdf;padding:7px 13px;border-radius:5px;font-size:12px}.side{padding:25px 23px;overflow:auto;border-left:1px solid #2c383b}h2{font-size:12px;letter-spacing:2px;color:#9eafb1;margin:0 0 16px}.score{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #2c383b}.team{display:flex;align-items:center;gap:10px}.swatch{width:10px;height:10px;border-radius:2px}.red{background:#e87671}.blue{background:#77adeb}.value{font-size:12px;color:#b6c9c9}.section{margin-top:28px}.address{font:16px monospace;color:#eef6e8;margin:8px 0 12px}.note{font-size:12px;color:#9fafb2}.players{font-size:13px;line-height:2.1}.log{font-size:11px;color:#9fafb2;overflow-wrap:anywhere}.log p{padding:7px 0;margin:0;border-bottom:1px solid #223135}code{color:#b8e3cc}a{color:#b8e3cc}#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#132126e8;padding:15px 24px;border-radius:7px}@media(max-width:800px){header{padding:0 18px;height:72px}main{height:auto;display:flex;flex-direction:column}.stage{height:65vh;min-height:400px}.side{border-left:0}.tools{left:12px;top:12px}.tag{font-size:10px}h1{font-size:20px}}
.tools button[aria-pressed="true"]{background:#426b59;border-color:#a2dcba}.tools{right:18px}.hint{max-width:calc(100% - 44px);pointer-events:none}.players{white-space:pre-line}#gear{line-height:1.7}
</style><link rel="stylesheet" href="/arena-ui.css"></head>
<body><header><div><div class="tag">CRYPT SQUADS / ARENA</div><h1>古堡争床</h1></div><nav><a href="/actions">物品动作</a> · <a href="/rules">比赛规则</a> · <a href="/replays">完整回放</a></nav><div class="live" id="live">正在连接测试服</div></header>
<main><section class="stage"><iframe id="scene" src="/scene/" title="Minecraft 实时地图"></iframe><div class="tools"><button data-camera="auto">导演视角</button><select id="focus-player" aria-label="选择 AI 视角"><option value="">选择一位 AI 跟随</option></select><button data-camera="pov-selected">所选 AI 第一视角</button><button data-camera="side" aria-pressed="false">地图总览</button><button data-camera="red" aria-pressed="false">红队基地</button><button data-camera="center" aria-pressed="false">中心岛</button><button data-camera="green">绿队基地</button><button data-camera="yellow">黄队基地</button><button data-camera="blue" aria-pressed="false">蓝队基地</button><button data-camera="follow-red" aria-pressed="false">跟随红队</button><button data-camera="follow-blue" aria-pressed="false">跟随蓝队</button><button data-camera="follow-green" aria-pressed="false">跟随绿队</button><button data-camera="pov-green" aria-pressed="false">绿队第一视角</button><button data-camera="follow-yellow" aria-pressed="false">跟随黄队</button><button data-camera="pov-yellow" aria-pressed="false">黄队第一视角</button><button data-camera="pov-red" aria-pressed="false">红队第一视角</button><button data-camera="pov-blue" aria-pressed="false">蓝队第一视角</button></div><div id="loading">正在载入真实地图…</div><div class="hint"><span id="camera-status">平视跟随</span> · 可切换第一视角 · 固定镜头下拖动旋转、滚轮缩放</div></section>
<aside class="side"><h2><span id="match-title">起床战争</span></h2><div class="score"><span class="team"><i class="swatch red"></i>红队</span><span class="value" id="redBed">读取中</span></div><div class="score"><span class="team"><i class="swatch blue"></i>蓝队</span><span class="value" id="blueBed">读取中</span></div><div id="extra-teams"></div><p class="note" id="map-attribution"></p><div class="section"><h2>本场 AI 阵容</h2><div class="players" id="demo">等待示例开始</div></div><div class="section"><h2>装备与升级</h2><div id="gear" class="players note"></div></div><div class="section"><h2>当前玩家</h2><div class="players" id="players">正在读取</div></div><div class="section"><h2>进入游戏</h2><div class="address" id="game-address">正在读取</div><button id="copy">复制服务器地址</button><p class="note" id="join-note">Minecraft Java 版 1.21<br>进入后输入 <code>/localbw</code> 加入。<br>两人入场后倒计时开局。</p></div><div class="section"><h2>当前版本</h2><p class="note">测试支持突袭、稳健等策略组合。<br>近战结合训练模型与地形、距离控制；路线、资源和进退采用公开策略。参赛者自行开发和训练。</p></div><div class="section"><h2>现场记录</h2><div class="log" id="log"></div></div></aside></main>
<script src="/effects.js"></script><script src="/map-loading.js"></script>
<script src="/spectator-camera.js"></script><script src="/actor-roster.js"></script>
<script src="/player-motion.js"></script><script src="/native-items.js"></script><script src="/native-poses.js"></script><script src="/world-objects.js"></script><script src="/spectator-actors.js"></script>
<script>
const scene=document.querySelector('#scene');const avatarLayer=new SpectatorActors(scene);fetch('/api/rules').then(r=>r.json()).then(r=>{avatarLayer.setMap(r.map);camera.setMap(r.map)});
const camera=new SpectatorCamera(scene,{defaultMode:new URLSearchParams(location.search).get('view')||'auto',onStatus:value=>document.querySelector('#camera-status').textContent=value});camera.bind();
document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('game-address').textContent);document.querySelector('#copy').textContent='已复制'};
let liveSocket=null,requiredColumns=[],sceneReady=false,mapConnected=false;
function track(now){const socket=scene.contentWindow?.localView?.socket;if(socket&&socket!==liveSocket){liveSocket=socket;socket.on('refereeFrame',state=>{avatarLayer.setLive(state)})}if(sceneReady)camera.setPlayers(avatarLayer.renderLive(now));camera.tick(now);requestAnimationFrame(track)}requestAnimationFrame(track);
function text(id,value){document.getElementById(id).textContent=value}
async function refresh(){try{const s=await(await fetch('/status')).json();requiredColumns=s.map_columns||[];mapConnected=s.connected;text('match-title',s.title||'起床战争');text('map-attribution',s.attribution||'');const rows=document.querySelector('#extra-teams');rows.replaceChildren(...['green','yellow'].filter(k=>k in s.beds).map(k=>{const p=document.createElement('p');p.textContent=({green:'绿队',yellow:'黄队'})[k]+' · '+(s.beds[k]===null?'读取中':s.beds[k]?'床仍在':'床已被拆');return p;}));text('game-address',s.gameAddress||'地址不可用');if(s.managed)text('join-note','本场由比赛中心安排 AI 入场。观战和回放不占参赛席位。');text('live',s.connected?(s.referee?.test_run?'规则验收 · 非比赛':'本机测试服')+' · '+(s.referee?.phase==='running'?Math.floor(s.referee.tick/1200)+':'+String(Math.floor(s.referee.tick/20)%60).padStart(2,'0'):'等待开局'):'地图加载中');text('redBed',s.beds.red===null?'读取中':s.beds.red?'床仍在':'床已被拆');text('blueBed',s.beds.blue===null?'读取中':s.beds.blue?'床仍在':'床已被拆');text('players',s.players.length?s.players.map(p=>{const m=s.referee?.players?.find(m=>m.name===p.name);const team=s.referee?.teams?.find(t=>t.name===m?.team);const label=m?.mode==='SPECTATOR'?((m.respawn_pending??(m.respawn_seconds>0||team?.bed))?('等待复活'+(m.respawn_seconds>0?' '+Math.ceil(m.respawn_seconds)+'秒':'')):'已淘汰'):p.y>90?'等待区':'竞技场';return p.name+' · '+label}).join('\n'):'暂无玩家');const roster=s.demo?.agents||[];ActorRoster.render(document.querySelector('#demo'),roster,name=>camera.focus(name));avatarLayer.setProfiles(roster);camera.setProfiles(roster);text('gear',(s.demo?.agents||[]).map(a=>{const tier=a.armor?.at(-1)?.split('_')[0],arm={leather:'皮甲',chainmail:'锁链护甲',iron:'铁护甲',diamond:'钻石护甲'}[tier]||'待入场';const sword=['diamond','iron','stone','wooden'].find(t=>a.inventory.some(i=>i.name===t+'_sword'));const names={diamond:'钻石剑',iron:'铁剑',stone:'石剑',wooden:'木剑'};const ups={forge:'熔炉',protection:'保护',sharpness:'锋利',haste:'急迫',heal_pool:'治疗池',trap:'陷阱'};const effects=s.referee?.players?.find(p=>p.name===a.name)?.effects||[];const fx=effects.map(e=>({invisibility:'隐身',speed:'迅捷',jump_boost:'跳跃',regeneration:'再生',absorption:'伤害吸收',haste:'急迫',blindness:'失明',slowness:'缓慢'}[e.name]||e.name)).join(' · ');return [a.name+' · '+Math.ceil(a.health)+' HP',arm+' / '+(names[sword]||'无剑'),a.model_parameter_bytes?'近战模型 '+(a.model_parameters/10000).toFixed(1)+' 万参数 · '+(a.model_parameter_bytes/1048576).toFixed(2)+' MiB':'',fx,Object.entries(a.upgrades||{}).filter(([,l])=>l>0).map(([k,l])=>ups[k]+' '+l).join(' · ')].filter(Boolean).join('\n')}).join('\n\n'));avatarLayer.setLive(s.referee);const log=document.querySelector('#log');log.replaceChildren(...s.messages.slice(-5).map(m=>{const p=document.createElement('p');p.textContent=m;return p}));}catch{ text('live','正在重新连接') }}
setInterval(()=>{try{const v=scene.contentWindow.localView,loaded=v?.viewer.world.loadedChunks||{},progress=MapLoading.progress(requiredColumns,loaded);sceneReady=mapConnected&&MapLoading.complete(requiredColumns,loaded,v?.viewer.world.sectionsOutstanding.size??1);const indicator=document.querySelector('#loading');indicator.hidden=sceneReady;if(!sceneReady)indicator.textContent=progress.total?'地图加载中 '+Math.floor(progress.loaded*100/progress.total)+'%':'正在连接地图…';}catch{}},500);
refresh();setInterval(refresh,250);
</script></body></html>
