<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>悬空夺床 · 平视回放</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101719;color:#e7f0e8;font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}header{padding:18px 26px;min-height:80px;border-bottom:1px solid #2c383b;display:flex;align-items:center;gap:22px;flex-wrap:wrap}h1{font-size:22px;margin:0}a{color:#a8d9c0}select,button{font:inherit;font-size:12px;color:#edf4ed;background:#142327ed;border:1px solid #526365;padding:8px 12px;border-radius:5px;cursor:pointer}button:hover{background:#28474d}button[aria-pressed="true"]{background:#426b59;border-color:#a2dcba}main{display:grid;grid-template-columns:minmax(0,1fr) 288px;height:calc(100vh - 80px)}.playback{min-width:0;display:flex;flex-direction:column}.stage{position:relative;background:#add8e6;flex:1;min-height:400px}iframe{display:block;width:100%;height:100%;border:0;position:absolute;inset:0}.tools{position:absolute;left:20px;right:20px;top:18px;display:flex;gap:7px;flex-wrap:wrap}.hint{position:absolute;left:20px;bottom:18px;background:#f5f9efdf;color:#203738;padding:6px 12px;border-radius:5px;font-size:12px;max-width:calc(100% - 40px);pointer-events:none}#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#132126ed;padding:15px 24px;border-radius:7px}.controls{display:flex;gap:12px;align-items:center;padding:15px 20px}.controls input{flex:1;min-width:60px;accent-color:#a8d9c0}.side{padding:24px 22px;overflow:auto;border-left:1px solid #2c383b;font-size:13px;color:#b8cacc}#events p{border-bottom:1px solid #2e4246;padding:8px 0;margin:0}.note{color:#91a8aa;font-size:12px;padding:0 20px;margin:0 0 14px}#players{white-space:pre-line}#result{color:#e7f0e8;font-size:18px;margin-bottom:20px}#time{font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}@media(max-width:800px){header{padding:14px;gap:12px}main{height:auto;display:block}.stage{height:65vh;min-height:430px}.side{border-left:0;border-top:1px solid #2c383b}.tools{left:12px;right:12px;top:12px;gap:5px}.tools button{padding:7px 9px}.controls{padding:12px;gap:7px}#matches{max-width:100%}h1{font-size:20px}}
</style></head>
<body><header><h1>比赛回放 · 平视 3D</h1><a href="/">实时观战</a><a href="/rules">比赛规则</a><select id="matches" aria-label="选择比赛"><option>正在读取比赛</option></select></header>
<main><section class="playback"><div class="stage"><iframe id="scene" title="Minecraft 比赛 3D 回放"></iframe>
<div class="tools"><button data-camera="side">平视全景</button><button data-camera="red">红队基地</button><button data-camera="center">中心岛</button><button data-camera="blue">蓝队基地</button><button data-camera="follow-red">跟随红队</button><button data-camera="follow-blue">跟随蓝队</button><button data-camera="pov-red">红队第一视角</button><button data-camera="pov-blue">蓝队第一视角</button></div>
<div id="loading">正在载入比赛…</div><div class="hint"><span id="camera-status">平视跟随</span> · 可切换第一视角 · 固定镜头下拖动旋转、滚轮缩放</div></div>
<div class="controls"><button id="play" disabled>播放</button><input id="seek" aria-label="回放进度" type="range" min="0" max="1" value="0" disabled><span id="time">00:00 / 00:00</span><select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option></select></div>
<p class="note">使用本地地图与真实比赛记录还原，可暂停、拖动进度和加速。第一视角跟随 AI 当时的朝向；人物装备与动作随比赛记录更新。</p></section>
<aside class="side"><div id="result">尚未选择比赛</div><div id="players"></div><h3>比赛事件</h3><div id="events"></div></aside></main>
<script src="/spectator-camera.js"></script><script src="/effects.js"></script><script src="/replay-timeline.js"></script><script src="/player-motion.js"></script><script src="/native-items.js"></script><script src="/native-poses.js"></script><script src="/spectator-actors.js"></script><script src="/replay.js"></script></body></html>
