<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物品动作说明 · 悬空夺床</title><style>*{box-sizing:border-box}body{margin:0;background:#101719;color:#e7f0e8;font:15px/1.8 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:25px 22px 65px}a{color:#b5e0c8}nav{margin-bottom:28px}h1{font-size:26px}h2{font-size:18px;margin:10px 0}.note{color:#a5b8b8}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:25px}.card{background:#1a292c;border:1px solid #33474b;border-radius:7px;overflow:hidden}.card img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}.card .text{padding:15px}.button{display:inline-block;background:#2e5447;color:#eff9ef;text-decoration:none;padding:7px 14px;border:1px solid #618976;border-radius:4px}li{margin:9px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><nav><a href="/">实时观战</a> · <a href="/replays">完整回放</a> · <a href="/rules">比赛规则</a></nav><h1>物品动作说明</h1><p>观赛中的持有、使用和挥击动作按服务器记录播放。可以在回放中切换平视和第一视角。</p><p class="note">完整比赛在“完整回放”中查看。动作示例会在相应记录准备好后显示。</p><div class="grid" id="examples"></div><h2>地图与物品核对</h2><ul id="checks"></ul></main><script>
const descriptions={eat:['吃金苹果','持续使用后获得再生和吸收生命。'],drink:['喝药水','饮用后保留玻璃瓶，药液颜色对应实际效果。'],bow:['拉弓放箭','蓄力决定箭速，满蓄力后发射箭实体。']};
const cards=new Map();
for(const [name,[title,description]] of Object.entries(descriptions)){
 const card=document.createElement('article');card.className='card';const text=document.createElement('div');text.className='text';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=description;text.append(h,p);card.append(text);document.querySelector('#examples').append(card);cards.set(name,{card,text,title});
}
fetch('/api/action-reference').then(r=>r.ok?r.json():{examples:[],checks:[]}).then(data=>{
 for(const c of data.examples||[]){const target=cards.get(c.name);if(!target)continue;const img=document.createElement('img');img.src=c.image;img.alt=target.title+'动作示例';const a=document.createElement('a');a.className='button';a.href=c.replay;a.textContent='观看动作回放';target.text.append(a);target.card.prepend(img);}
 for(const c of data.checks||[]){const li=document.createElement('li'),a=document.createElement('a');a.href=c.replay;a.textContent=c.label;li.append(a);document.querySelector('#checks').append(li);}
 if(!data.checks?.length)document.querySelector('#checks').textContent='本实例尚无动作示例录像。';
}).catch(()=>document.querySelector('#checks').textContent='动作示例暂时不可用，仍可查看完整比赛回放。');
</script></body></html>
