<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物品动作对照 · 悬空夺床</title><style>*{box-sizing:border-box}body{margin:0;background:#101719;color:#e7f0e8;font:15px/1.8 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:25px 22px 65px}a{color:#b5e0c8}nav{margin-bottom:28px}h1{font-size:26px}h2{font-size:18px;margin:10px 0}.note{color:#a5b8b8}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:25px}.card{background:#1a292c;border:1px solid #33474b;border-radius:7px;overflow:hidden}.card img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}.card .text{padding:15px}.button{display:inline-block;background:#2e5447;color:#eff9ef;text-decoration:none;padding:7px 14px;border:1px solid #618976;border-radius:4px}li{margin:9px 0}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><nav><a href="/">实时观战</a> · <a href="/replays">完整回放</a> · <a href="/rules">比赛规则</a></nav><h1>原版物品动作对照</h1><p>截图来自真正的 Minecraft Java 1.21 客户端。下方回放使用相同服务器中的动作记录，保留平视和第一视角切换。</p><p class="note">这些是预先配置物品和位置的单项演示；完整比赛在“完整回放”中查看。原版观战可双击项目中的“原版观战.cmd”。</p><div class="grid" id="examples"></div><h2>地图与物品核对</h2><ul id="checks"></ul></main><script>
fetch('/api/action-reference').then(r=>r.json()).then(data=>{
 const descriptions={eat:['吃金苹果','持续使用 32 刻，获得再生和吸收生命。'],drink:['喝药水','使用后保留玻璃瓶，药液颜色对应实际效果。'],bow:['拉弓放箭','持续蓄力，达到满蓄力后发射真实箭实体。']};
 for(const c of data.examples){const [title,description]=descriptions[c.name],card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=c.image;img.alt='原版客户端：'+title;const text=document.createElement('div');text.className='text';const h=document.createElement('h2');h.textContent=title;const p=document.createElement('p');p.textContent=description;const a=document.createElement('a');a.className='button';a.href=c.replay;a.textContent='观看动作回放';text.append(h,p,a);card.append(img,text);document.querySelector('#examples').append(card);}
 for(const c of data.checks){const li=document.createElement('li'),a=document.createElement('a');a.href=c.replay;a.textContent=c.label;li.append(a);document.querySelector('#checks').append(li);}
}).catch(()=>document.querySelector('#examples').textContent='动作记录尚未准备好。');
</script></body></html>
